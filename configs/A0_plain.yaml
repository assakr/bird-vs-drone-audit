# Ablation A0_plain: Plain lightweight detector: CSP backbone + FPN only, P3-P5, CIoU
# Cumulative chain A0 -> A6; identical data, budget and evaluation (rev. 1-3 runs were not seeded; see *_s1, *_s2).
_base_: v2_full.yaml

data:
  yaml: data/data_clean.yaml

model:
  attention_type: cbam
  use_p2: false
  use_msfe: false
  use_caam: false
  use_bff: false
  use_transformer: false

loss:
  iou_type: ciou

train:
  epochs: 50
  max_train_samples: 3000   # same budget as the reported v2 run; set to 1000000 for full-data training
  save_dir: runs/A0_plain/
