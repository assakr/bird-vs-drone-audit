# Rev. 5 ablation B1_p2_sa: + P2 level, trained WITH the scale-aware assignment.
# Same architecture, data, budget and evaluation as A1_p2; only the target assignment,
# centre decode and seed differ. Chain B0 -> B5 (then A7 = B5 + Wise-IoU) repeats the
# architecture ablation under a working assigner.
_base_: A1_p2.yaml

model:
  center_decode: linear

loss:
  assigner: scale_aware
  center_radius: 2.5
  level_ranges: [[0, 64], [32, 128], [96, 256], [192, 100000]]   # P2, P3, P4, P5 (same as A7)
  obj_iou_target: true

train:
  seed: 0
  save_dir: runs/B1_p2_sa/
